name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install thetabook from PyPI
        # Pinned: the registry's lint contract is tied to thetabook's
        # SkillFrontmatter schema, so bump this deliberately.
        run: pip install "thetabook==2.4.0"

      - name: Lint core/
        if: hashFiles('core/**/*.md') != ''
        run: thetabook skills lint core --fail-on-error

      - name: Lint community/
        if: hashFiles('community/**/*.md') != ''
        run: thetabook skills lint community --fail-on-error
